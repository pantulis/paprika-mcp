# fly.toml — paprika-mcp remote server (Streamable HTTP + OAuth for Gemini)
#
# App name below is a placeholder; `fly launch` / `fly apps create` will be
# used to pick a globally-unique name at deploy time.

app = "paprika-mcp-pantulis"
primary_region = "mad"

[build]

[env]
  PORT = "8000"

[[mounts]]
  source = "paprika_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/healthz"
    port = 8000
    timeout = "5s"
    type = "http"
